name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare dist (self-hosted static site — no build step)
        run: |
          node scripts/generate-journal-pages.js
          node scripts/generate-language-pages.js
          mkdir -p dist/src/assets
          cp index.html dist/
          cp robots.txt dist/ 2>/dev/null || true
          cp sitemap.xml dist/ 2>/dev/null || true
          cp llms.txt dist/ 2>/dev/null || true
          cp -R journal dist/ 2>/dev/null || true
          cp -R nl dist/ 2>/dev/null || true
          cp -R en dist/ 2>/dev/null || true
          cp -R de dist/ 2>/dev/null || true
          cp -R admin dist/ 2>/dev/null || true
          # Copy only assets actually referenced by the public site.
          cp src/assets/favicon.ico             dist/src/assets/ 2>/dev/null || true
          cp src/assets/favicon-16.png          dist/src/assets/ 2>/dev/null || true
          cp src/assets/favicon-32.png          dist/src/assets/ 2>/dev/null || true
          cp src/assets/apple-touch-icon.png    dist/src/assets/ 2>/dev/null || true
          cp src/assets/logo-crest.png          dist/src/assets/ 2>/dev/null || true
          cp src/assets/hero-chateau-720w.webp   dist/src/assets/ 2>/dev/null || true
          cp src/assets/hero-chateau-1280w.webp  dist/src/assets/ 2>/dev/null || true
          cp src/assets/hero-chateau-2560w.webp  dist/src/assets/ 2>/dev/null || true
          cp src/assets/hero-chateau-720w.jpg    dist/src/assets/ 2>/dev/null || true
          cp src/assets/hero-chateau-1280w.jpg   dist/src/assets/ 2>/dev/null || true
          cp src/assets/hero-chateau-2560w.jpg   dist/src/assets/ 2>/dev/null || true
          cp src/assets/lieu-domaine-720w.webp   dist/src/assets/ 2>/dev/null || true
          cp src/assets/lieu-domaine-1024w.webp  dist/src/assets/ 2>/dev/null || true
          cp src/assets/lieu-domaine-720w.jpg    dist/src/assets/ 2>/dev/null || true
          cp src/assets/lieu-domaine-1024w.jpg   dist/src/assets/ 2>/dev/null || true
          cp src/assets/brasserie-production-720w.webp   dist/src/assets/ 2>/dev/null || true
          cp src/assets/brasserie-production-1920w.webp  dist/src/assets/ 2>/dev/null || true
          cp src/assets/brasserie-production-720w.jpg    dist/src/assets/ 2>/dev/null || true
          cp src/assets/brasserie-production-1920w.jpg   dist/src/assets/ 2>/dev/null || true
          cp src/assets/bieres-bouteilles-720w.webp   dist/src/assets/ 2>/dev/null || true
          cp src/assets/bieres-bouteilles-1280w.webp  dist/src/assets/ 2>/dev/null || true
          cp src/assets/bieres-bouteilles-720w.jpg    dist/src/assets/ 2>/dev/null || true
          cp src/assets/bieres-bouteilles-1280w.jpg   dist/src/assets/ 2>/dev/null || true
          cp src/assets/visite-gate-720w.webp   dist/src/assets/ 2>/dev/null || true
          cp src/assets/visite-gate-1024w.webp  dist/src/assets/ 2>/dev/null || true
          cp src/assets/visite-gate-720w.jpg    dist/src/assets/ 2>/dev/null || true
          cp src/assets/visite-gate-1024w.jpg   dist/src/assets/ 2>/dev/null || true
          cp src/assets/jardins-visites-720w.webp   dist/src/assets/ 2>/dev/null || true
          cp src/assets/jardins-visites-1024w.webp  dist/src/assets/ 2>/dev/null || true
          cp src/assets/jardins-visites-720w.jpg    dist/src/assets/ 2>/dev/null || true
          cp src/assets/jardins-visites-1024w.jpg   dist/src/assets/ 2>/dev/null || true
          echo "Deployed assets:"
          ls -la dist/src/assets/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
